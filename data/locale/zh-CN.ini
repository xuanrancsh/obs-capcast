CapCast.Lost.Title=CapCast：设备已断开
CapCast.Lost.Audio.Body=采集卡音频设备「%1」在运行中断开了，音频映射已停止。
CapCast.Lost.Display.Body=采集卡副屏「%1」在运行中断开了，投屏已停止。
CapCast.Lost.Why=为避免画面或声音被送到别的设备（可能造成混响、投错屏），插件不会自动改用其他设备，你的设置原样保留。
CapCast.Lost.Fix=请检查设备连接后重启 OBS，插件会按原来的设置重新应用。
CapCast.Lost.What.Display=采集卡副屏
CapCast.Lost.What.Audio=采集卡音频设备
CapCast.Lost.NotFound.Body=找不到上次使用的%1，已关闭全部映射，等待你重新选择。
CapCast.Lost.NotFound.Fix=请确认设备已连接，然后在下拉框里重新选择并启动。
CapCast.Lost.NotFound.Start=找不到上次使用的%1，已停止全部映射，请重新选择设备
CapCast.Status.DeviceLost=设备已断开
CapCast.Status.DeviceReturned=设备已恢复，可重新启动
