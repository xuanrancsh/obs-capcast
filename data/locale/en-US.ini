CapCast.Lost.Title=CapCast: device disconnected
CapCast.Lost.Audio.Body=The capture card audio device "%1" disconnected during output. Audio mapping has been stopped.
CapCast.Lost.Display.Body=The capture card display "%1" disconnected during output. The projector has been stopped.
CapCast.Lost.Why=To avoid sending video or audio to another device (which can cause echo or projecting to the wrong screen), the plugin will not switch to a different device. Your settings are kept as-is.
CapCast.Lost.Fix=Check the device connection and restart OBS; the plugin will re-apply your previous settings.
CapCast.Lost.What.Display=capture card display
CapCast.Lost.What.Audio=capture card audio device
CapCast.Lost.NotFound.Body=Could not find the previously used %1. All mappings have been stopped, waiting for you to choose again.
CapCast.Lost.NotFound.Fix=Make sure the device is connected, then select it again in the dropdown and start.
CapCast.Lost.NotFound.Start=Could not find the previously used %1; all mappings stopped. Please select the device again
CapCast.Status.DeviceLost=device disconnected
CapCast.Status.DeviceReturned=device is back, ready to restart
